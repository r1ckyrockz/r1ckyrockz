<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Riccardo Carano: Engineering Leader, 2x Founder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#121a33"/>
      <stop offset="1" stop-color="#1b1035"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .name { font: 800 64px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f8fafc; letter-spacing: -1px; }
      .role { font: 600 26px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: url(#accent); }
      .sub  { font: 400 19px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #94a3b8; }
      .code { font: 500 15px 'SFMono-Regular', Menlo, Consolas, monospace; fill: #64748b; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .orbit { transform-origin: 1010px 150px; animation: spin 40s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .cursor, .orbit { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow2)"/>

  <!-- left: text -->
  <text x="70" y="70" class="code">~/riccardo $ whoami<tspan class="cursor"> ▍</tspan></text>
  <text x="66" y="148" class="name">Riccardo Carano</text>
  <text x="70" y="192" class="role">Engineering Leader · 2× Founder · Builder</text>
  <text x="70" y="232" class="sub">Teams that ship. Products people use. Honest numbers.</text>
  <rect x="70" y="252" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- right: orbit graphic -->
  <g class="orbit" fill="none" stroke-linecap="round">
    <circle cx="1010" cy="150" r="96" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 10"/>
    <circle cx="1010" cy="150" r="64" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="1106" cy="150" r="7" fill="#f472b6"/>
    <circle cx="946" cy="150" r="5" fill="#38bdf8"/>
    <circle cx="1010" cy="54" r="4" fill="#a5b4fc"/>
  </g>
  <circle cx="1010" cy="150" r="30" fill="url(#accent)" opacity="0.9"/>
  <text x="1010" y="158" text-anchor="middle" style="font: 800 22px 'Segoe UI', Arial, sans-serif; fill:#0b1020">RC</text>
</svg>
